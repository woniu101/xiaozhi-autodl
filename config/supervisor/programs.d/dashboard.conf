[program:dashboard]
command=/root/xiaozhi-autodl/bin/start-dashboard
directory=/root/xiaozhi-autodl
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/xiaozhi-autodl/logs/dashboard.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
priority=10

[program:web-gateway]
command=/root/xiaozhi-autodl/bin/start-web-gateway
directory=/root/xiaozhi-autodl
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/xiaozhi-autodl/logs/web-gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
priority=20

[program:manager-api]
command=/root/xiaozhi-autodl/bin/start-manager-api
directory=/root/xiaozhi-autodl
autostart=true
autorestart=true
startsecs=10
startretries=20
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/xiaozhi-autodl/logs/manager-api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
priority=40

[program:index-tts]
command=/root/xiaozhi-autodl/bin/start-index-tts
directory=/root/index-tts
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0,75
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/xiaozhi-autodl/logs/index-tts.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
priority=50

[program:xiaozhi-server]
command=/root/xiaozhi-autodl/bin/start-xiaozhi-server
directory=/root/xiaozhi-esp32-server/main/xiaozhi-server
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0,75
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/xiaozhi-autodl/logs/xiaozhi-server.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
priority=60
