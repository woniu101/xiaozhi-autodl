user root;
worker_processes auto;
pid /root/autodl-tmp/xiaozhi-autodl/run/nginx.pid;
error_log /root/autodl-tmp/xiaozhi-autodl/logs/nginx-error.log warn;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /root/autodl-tmp/xiaozhi-autodl/logs/nginx-access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 0.0.0.0:6008;
        server_name _;
        root /root/xiaozhi-autodl/artifacts/manager-web;
        index index.html;

        location ^~ /xiaozhi/v1/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /mcp/vision/explain {
            proxy_pass http://127.0.0.1:8003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ^~ /xiaozhi/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
